# =============================================================================
# Crypto News Telegram Bot — Configuration File
# =============================================================================
# Edit this file to change bot settings, sources, hashtags, and keywords.
# The Python script reads this file at startup.
# =============================================================================

# -----------------------------------------------------------------------------
# BOT CREDENTIALS  (keep private — never share this file publicly)
# -----------------------------------------------------------------------------
bot:
  token: "8809855821:AAHaEUQZNbATetvdNSf8WlqPMwZJy7TbO1g"
  owner_id: 7237337181
  openai_api_key: null        # Set to "sk-..." string if you have an OpenAI key


# -----------------------------------------------------------------------------
# OPERATIONAL SETTINGS
# -----------------------------------------------------------------------------
settings:
  poll_interval_seconds: 30   # How often to check all sources (seconds)
  max_news_age_hours: 48      # Skip articles older than this many hours
  request_timeout_seconds: 15 # HTTP timeout per request
  max_retries: 3              # Retry failed HTTP requests this many times
  max_concurrent_fetches: 5   # Max simultaneous HTTP connections
  user_agent: "Mozilla/5.0 (compatible; CryptoNewsBot/1.0)"

  summary:
    min_words: 30             # Minimum summary length
    max_words: 70             # Maximum summary length

  logging:
    level: "INFO"             # DEBUG / INFO / WARNING / ERROR
    max_bytes: 5242880        # 5 MB max log file size
    backup_count: 5           # Number of rotated log files to keep
    filename: "news_bot.log"  # Log filename (stored next to script)

  database:
    filename: "news_bot.db"   # SQLite database filename (stored next to script)


# -----------------------------------------------------------------------------
# MONITORED SOURCES
# Listed in priority order: Telegram -> TON -> Crypto -> NFT -> Exchange -> Security -> Scam
# Each source:
#   name        : Display name shown in posts
#   category    : Must match one of the categories defined below
#   feed_url    : RSS/Atom feed URL (primary method)
#   fallback_url: Web page to scrape if RSS is empty or broken (optional)
# -----------------------------------------------------------------------------
sources:

  # --- Telegram (TOP PRIORITY) ----------------------------------------------
  - name: "Telegram Blog"
    category: "Telegram"
    feed_url: "https://telegram.org/blog/rss"
    fallback_url: "https://telegram.org/blog"

  # --- TON Ecosystem --------------------------------------------------------
  - name: "TON Foundation Blog"
    category: "TON"
    feed_url: "https://ton.org/en/blog/rss.xml"
    fallback_url: "https://ton.org/en/blog"

  - name: "CoinTelegraph TON"
    category: "TON"
    feed_url: "https://cointelegraph.com/rss/tag/ton"
    fallback_url: "https://cointelegraph.com/tags/ton"

  # --- Crypto News ----------------------------------------------------------
  - name: "CoinDesk"
    category: "Crypto"
    feed_url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    fallback_url: "https://www.coindesk.com/"

  - name: "CoinTelegraph"
    category: "Crypto"
    feed_url: "https://cointelegraph.com/rss"
    fallback_url: "https://cointelegraph.com/"

  - name: "Decrypt"
    category: "Crypto"
    feed_url: "https://decrypt.co/feed"
    fallback_url: "https://decrypt.co/news"

  # --- NFT News -------------------------------------------------------------
  - name: "CoinTelegraph NFT"
    category: "NFT"
    feed_url: "https://cointelegraph.com/rss/tag/nft"
    fallback_url: "https://cointelegraph.com/tags/nft"

  - name: "NFT Plazas"
    category: "NFT"
    feed_url: "https://nftplazas.com/feed/"
    fallback_url: "https://nftplazas.com/news/"

  # --- Exchange Announcements -----------------------------------------------
  - name: "Binance"
    category: "Exchange"
    feed_url: "https://www.binance.com/en/blog/rss"
    fallback_url: "https://www.binance.com/en/support/announcement"

  - name: "Coinbase"
    category: "Exchange"
    feed_url: "https://www.coinbase.com/blog/rss"
    fallback_url: "https://www.coinbase.com/blog"

  - name: "Kraken"
    category: "Exchange"
    feed_url: "https://blog.kraken.com/feed"
    fallback_url: "https://blog.kraken.com/"

  - name: "Bybit"
    category: "Exchange"
    feed_url: "https://announcements.bybit.com/en-US/rss/"
    fallback_url: "https://announcements.bybit.com/en-US/"

  - name: "OKX"
    category: "Exchange"
    feed_url: "https://www.okx.com/help/rss/announcements"
    fallback_url: "https://www.okx.com/help/section/announcements"

  - name: "Bitget"
    category: "Exchange"
    feed_url: "https://www.bitget.com/support/rss"
    fallback_url: "https://www.bitget.com/support/sections/12508313443481"

  - name: "KuCoin"
    category: "Exchange"
    feed_url: "https://www.kucoin.com/rss/news"
    fallback_url: "https://www.kucoin.com/announcement"

  # --- Security Alerts ------------------------------------------------------
  - name: "CoinTelegraph Hacks"
    category: "Security"
    feed_url: "https://cointelegraph.com/rss/tag/hacks"
    fallback_url: "https://cointelegraph.com/tags/hacks"

  - name: "The Hacker News"
    category: "Security"
    feed_url: "https://feeds.feedburner.com/TheHackersNews"
    fallback_url: "https://thehackernews.com/"

  # --- Scam Alerts ----------------------------------------------------------
