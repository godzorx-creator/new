    category: "Scam"
    feed_url: "https://cointelegraph.com/rss/tag/scams"
    fallback_url: "https://cointelegraph.com/tags/scams"


# -----------------------------------------------------------------------------
# CATEGORIES
# priority : lower number = sent first (1 = highest priority)
# hashtags : appended at the bottom of every post in this category
# keywords : used to auto-detect the correct category from article text/title
#            (checked in order: Scam -> Security -> Exchange -> TON -> Telegram -> NFT -> Crypto)
# -----------------------------------------------------------------------------
categories:

  Telegram:
    priority: 1
    hashtags:
      - "#Telegram"
      - "#TelegramUpdate"
      - "#News"
    keywords:
      - "telegram app"
      - "telegram update"
      - "telegram messenger"
      - "telegram version"
      - "telegram premium"
      - "telegram feature"

  TON:
    priority: 2
    hashtags:
      - "#TON"
      - "#TonCoin"
      - "#TONBlockchain"
      - "#CryptoNews"
    keywords:
      - "ton blockchain"
      - "the open network"
      - "toncoin"
      - "ton ecosystem"
      - " ton "

  Crypto:
    priority: 3
    hashtags:
      - "#Crypto"
      - "#CryptoNews"
      - "#Bitcoin"
      - "#Blockchain"
    keywords:
      - "crypto"
      - "bitcoin"
      - "ethereum"
      - "blockchain"
      - "altcoin"
      - "token"
      - "defi"
      - "web3"

  NFT:
    priority: 4
    hashtags:
      - "#NFT"
      - "#NFTNews"
      - "#Web3"
    keywords:
      - "nft"
      - "non-fungible token"
      - "opensea"
      - "digital collectible"
      - "mint pass"

  Exchange:
    priority: 5
    hashtags:
      - "#Exchange"
      - "#CryptoExchange"
      - "#Trading"
    keywords:
      - "binance"
      - "bybit"
      - "okx"
      - "coinbase"
      - "kraken"
      - "bitget"
      - "kucoin"
      - "exchange listing"
      - "delisting"
      - "trading pair"

  Security:
    priority: 6
    hashtags:
      - "#Security"
      - "#CryptoHack"
      - "#Alert"
      - "#CyberSecurity"
    keywords:
      - "hack"
      - "hacked"
      - "hacker"
      - "exploit"
      - "vulnerability"
      - "breach"
      - "stolen"
      - "security incident"
      - "compromised"
      - "malware"
      - "drained"

  Scam:
    priority: 7
    hashtags:
      - "#Scam"
      - "#CryptoScam"
      - "#Alert"
      - "#StaySafe"
    keywords:
      - "scam"
      - "rug pull"
      - "rug-pull"
      - "phishing"
      - "ponzi"
      - "fraudulent"
      - "fraud alert"
      - "exit scam"
      - "impersonat"
      - "fake giveaway"


# -----------------------------------------------------------------------------
# MESSAGE FORMAT (for reference — time tags are auto-generated in code)
# -----------------------------------------------------------------------------
# Each post looks like:
#
#   🔔 #Crypto #News #11august2026
#
#   📰 Bitcoin hits all-time high
#
#   📝 [30-70 word summary here]
#
#   🌐 CoinDesk  |  🕒 11 Aug 2026 16:30 UTC
#   🔗 https://...
#
#   #4:30pmUTC #10:00pmIST
#   #Crypto #CryptoNews #Bitcoin #Blockchain
#
# Time tag formats:
#   Date : #11august2026     (day + month lowercase + year, no spaces)
#   UTC  : #4:30pmUTC        (12-hour, no leading zero, lowercase am/pm)
#   IST  : #10:00pmIST       (India Standard Time = UTC+5:30)
# -----------------------------------------------------------------------------